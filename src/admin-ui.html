        <div style="width: 44px; height: 44px; border-radius: 50%; background-color: var(--bg-subtle); border: 1px solid var(--border-control); color: var(--text-main); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h2>인증 토큰 입력</h2>
        <p>Discord 알림 봇 일정 관리를 위해 접근 토큰(key)을 입력하세요.<br />토큰은 이 브라우저에 저장되어 다음 방문부터 자동으로 로그인됩니다.</p>
        <div class="auth-err-msg" id="auth-err-msg"></div>
        <form onsubmit="submitAuth(event)">
          <input type="password" id="auth-input-key" class="auth-input" placeholder="API KEY 입력" autofocus autocomplete="off" />
          <button type="submit" class="btn-save" style="width: 100%; height: 42px;">확인</button>
        </form>
        <button type="button" class="auth-demo-link" onclick="startDemoMode()">데모 모드로 둘러보기</button>
      </div>
    </div>

    <script>
      (function() {
        'use strict';

        const ALL_DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        const DAY_LABELS = {
          'Mon': '월', 'Tue': '화', 'Wed': '수', 'Thu': '목', 'Fri': '금', 'Sat': '토', 'Sun': '일'
        };

        const AUTH_STORAGE_KEY = 'discord-bot-auth-token';
        const INSTALL_DISMISS_COUNT_KEY = 'install-toast-dismiss-count';
        const INSTALL_SNOOZE_UNTIL_KEY = 'install-toast-snooze-until';
        const INSTALL_SNOOZE_DAYS = 7;

        let memoryToken = '';
        let scheduleData = null;
        let originalSnapshot = '';
        let channelsList = [];
        let activeChannel = '';
        let currentModalIndex = null; // null or number (index in scheduleData.channels[activeChannel].items)
        let isSaving = false;
        let defaultsOpen = false;
        let draggingChannel = null;
        let dragJustHappened = false;
        let deferredInstallPrompt = null;

        // Android Chrome: capture the native install prompt so we can trigger it
        // from our own toast button instead of the browser's default mini-infobar.
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          deferredInstallPrompt = e;
        });

        // Installing counts as neither a "close" nor a snooze — no dismiss record.
        window.addEventListener('appinstalled', function() {
          deferredInstallPrompt = null;
          const el = document.getElementById('install-toast');
          if (el) el.classList.remove('show');
        });

        const CHANNEL_NAMES = {
          team: '팀',
          personal: '개인'
        };

        function getChannelDisplayName(ch) {
          return CHANNEL_NAMES[ch] || ch;
        }

        // Seed data for demo matching new channel structure
        const SEED_DATA = {
          settings: {
            enabled: true
          },
          channels: {
            team: {
              enabled: true,
              days: ["Mon", "Tue", "Wed", "Thu", "Fri"],
              startDate: "2026-07-06",
              endDate: "2026-09-09",
              items: [
                {
                  name: "출근 알림",
                  time: "09:00",
                  message: "🌞️ 좋은 아침입니다!\n오늘도 화이팅! 💪️"
                },
                {
                  enabled: false,
                  name: "퇴근 알림",
                  time: "18:00",
                  message: "🎉️ 퇴근시간입니다!"
                },
                {
                  name: "퇴근 알림 (마지막)",
                  time: "18:00",
                  startDate: "2026-09-09",
                  endDate: "2026-09-09",
                  message: "🎉️ 퇴근시간입니다!"
                }
              ]
            },
            personal: {
              enabled: true,
              days: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
              startDate: "2026-09-06",
              endDate: null,
              items: [
                {
                  name: "개인 운동 시간",
                  time: "07:30",
                  message: "🏃‍♂️ 가벼운 스트레칭과 유산소 운동 시작하기!"
                },
                {
                  name: "하루 회고 및 메모",
                  time: "22:00",
                  message: "📝️ 오늘 배운 점과 내일 할 일을 기록하세요."
                }
              ]
            },
            test: {
              enabled: false,
              days: ["Mon", "Wed", "Fri"],
              startDate: null,
              endDate: null,
              items: [
                {
                  name: "테스트 알림",
                  time: "14:00",
                  message: "🧪️ 테스트 채널 알림 메시지입니다."
                }
              ]
            }
          }
        };

        // Theme Management (Light / Dark / System Mode)
        let currentThemePref = 'system';

        function applyTheme() {
          let effectiveTheme = currentThemePref;
          if (currentThemePref === 'system') {
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            effectiveTheme = prefersDark ? 'dark' : 'light';
          }
          document.documentElement.classList.add('no-theme-transition');
          document.documentElement.setAttribute('data-theme', effectiveTheme);

          // Update active state of segmented theme buttons
          ['light', 'dark', 'system'].forEach(t => {
            const btn = document.getElementById(`theme-opt-${t}`);
            if (btn) btn.classList.toggle('active', currentThemePref === t);
          });

          // Force layout reflow before removing transition blocker
          window.getComputedStyle(document.documentElement).opacity;
          requestAnimationFrame(() => {
            document.documentElement.classList.remove('no-theme-transition');
          });
        }

        window.setThemePreference = function(pref) {
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') return;
          currentThemePref = pref;
          localStorage.setItem('app-theme', pref);
          applyTheme();
        };

        function initTheme() {
          const saved = localStorage.getItem('app-theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') {
            currentThemePref = saved;
          } else {
            currentThemePref = 'system';
          }
          applyTheme();

          if (window.matchMedia) {
            const mq = window.matchMedia('(prefers-color-scheme: dark)');
            const changeHandler = () => {
              if (currentThemePref === 'system') {
                applyTheme();
              }
            };
            if (mq.addEventListener) {
              mq.addEventListener('change', changeHandler);
            } else if (mq.addListener) {
              mq.addListener(changeHandler);
            }
          }
        }

        window.toggleTheme = function() {
          if (currentThemePref === 'system') {
            setThemePreference('dark');
          } else if (currentThemePref === 'dark') {
            setThemePreference('light');
          } else {
            setThemePreference('system');
          }
        };

        window.addEventListener('DOMContentLoaded', function() {
          initTheme();
          const urlParams = new URLSearchParams(window.location.search);
          const key = urlParams.get('key');

          window.addEventListener('beforeunload', function(e) {
            if (hasUnsavedChanges()) {
              e.preventDefault();
              e.returnValue = '';
            }
          });

          if (key && key.trim() !== '') {
            memoryToken = key.trim();
            fetchSchedule(memoryToken);
          } else {
            let storedToken = '';
            try { storedToken = localStorage.getItem(AUTH_STORAGE_KEY) || ''; } catch (e) {}
            if (storedToken) {
              memoryToken = storedToken;
              fetchSchedule(memoryToken);
            } else {
              showAuthPrompt();
            }
          }
        });

        // ==========================================
        // API Calls & Data Lifecycle
        // ==========================================
        async function fetchSchedule(token) {
          document.getElementById('token-display').textContent = '불러오는 중...';
          try {
            if (token === 'demo-mode') {
              channelsList = Object.keys(SEED_DATA.channels);
              activeChannel = channelsList[0] || 'team';
              hideAuthScreen();
              loadScheduleData(JSON.parse(JSON.stringify(SEED_DATA)), channelsList);
              maybeShowInstallToast();
              return;
            }

            // Fetch channel list and schedule data in parallel
            const [channelsRes, scheduleRes] = await Promise.all([
              fetch(`/api/channels?key=${encodeURIComponent(token)}`),
              fetch(`/api/schedule?key=${encodeURIComponent(token)}`)
            ]);

            if (channelsRes.status === 401 || scheduleRes.status === 401) {
              try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (e) {}
              showAuthPrompt('인증 실패 (401 unauthorized). 유효한 토큰을 입력해 주세요.');
              return;
            }
            if (!channelsRes.ok) {
              const text = await channelsRes.text();
              throw new Error(`채널 목록 조회 실패: ${text}`);
            }
            if (!scheduleRes.ok) {
              const text = await scheduleRes.text();
              throw new Error(`일정 조회 실패: ${text}`);
            }

            const channelsJson = await channelsRes.json();
            const scheduleJson = await scheduleRes.json();

            try { localStorage.setItem(AUTH_STORAGE_KEY, token); } catch (e) {}
            hideAuthScreen();
            loadScheduleData(scheduleJson, channelsJson);
            maybeShowInstallToast();
          } catch (err) {
            showAuthPrompt(`연결 오류: ${err.message || 'API 서버를 찾을 수 없습니다.'}`);
          }
        }

        window.handleSave = async function() {
          if (!scheduleData || isSaving) return;

          hideErrorBanner();
          isSaving = true;
          setSaveButtonState(true);

          const payload = prepareCleanPayload(scheduleData);

          try {
            if (memoryToken === 'demo-mode') {
              await new Promise(r => setTimeout(r, 250));
              // Demo validation rule matching new server format:
              // channels.personal.items[3].time must be in HH:MM format.
              if (payload.channels && typeof payload.channels === 'object') {
                for (const [chKey, chData] of Object.entries(payload.channels)) {
                  if (chData && Array.isArray(chData.items)) {
                    for (let i = 0; i < chData.items.length; i++) {
                      const item = chData.items[i];
                      const timeRe = /^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$/;
                      if (item.repeat) {
                        const r = item.repeat;
                        const repeatOk = typeof r.startTime === 'string' && timeRe.test(r.startTime) &&
                          typeof r.endTime === 'string' && timeRe.test(r.endTime) &&
                          r.startTime < r.endTime &&
                          Number.isInteger(r.everyMinutes) && r.everyMinutes > 0;
                        if (!repeatOk) {
                          throw { isServerValidation: true, error: `channels.${chKey}.items[${i}].repeat must have valid startTime/endTime (HH:MM) and a positive integer everyMinutes.` };
                        }
                      } else if (!item.time || !timeRe.test(item.time)) {
                        throw { isServerValidation: true, error: `channels.${chKey}.items[${i}].time must be in HH:MM format.` };
                      }
                    }
                  }
                }
              }
              loadScheduleData(payload, channelsList);
              showToast('성공적으로 저장되었습니다 (데모).');
              return;
            }

            const res = await fetch(`/api/schedule?key=${encodeURIComponent(memoryToken)}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (res.status === 401) {
              try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (e) {}
              showAuthPrompt('인증 실패 (401 unauthorized). 다시 로그인해 주세요.');
              return;
            }

            const resText = await res.text();
            let resJson = null;
            try { resJson = JSON.parse(resText); } catch (_) {}

            if (!res.ok) {
              // Server error message displayed verbatim without modification!
              const verbatimError = (resJson && resJson.error) ? resJson.error : (resText || `HTTP ${res.status}`);
              showErrorBanner(verbatimError);
              showToast('저장 실패: 서버 오류');
              return;
            }

            if (resJson && resJson.schedule) {
              loadScheduleData(resJson.schedule, channelsList);
            } else {
              loadScheduleData(payload, channelsList);
            }
            showToast('성공적으로 저장되었습니다.');
          } catch (err) {
            if (err && err.isServerValidation) {
              showErrorBanner(err.error);
            } else {
              showErrorBanner(err.message || String(err));
            }
            showToast('저장 실패');
          } finally {
            isSaving = false;
            setSaveButtonState(false);
          }
        };

        // Cleans unused fields strictly so unused keys are removed, not null or []
        function prepareCleanPayload(data) {
          const clone = {
            settings: {
              enabled: Boolean(data.settings?.enabled),
              channelOrder: Array.isArray(data.settings?.channelOrder) ? [...data.settings.channelOrder] : []
            },
            channels: {}
          };

          const chKeys = Object.keys(data.channels || {}).sort();
          for (const ch of chKeys) {
            const src = data.channels[ch] || {};
            clone.channels[ch] = {
              enabled: src.enabled !== undefined ? Boolean(src.enabled) : true,
              days: Array.isArray(src.days) ? src.days : [...ALL_DAYS],
              startDate: src.startDate || null,
              endDate: src.endDate || null,
              items: Array.isArray(src.items) ? src.items.map(item => {
                const clean = {
                  name: item.name || '',
                  message: item.message || ''
                };
                if (item.repeat && typeof item.repeat === 'object') {
                  clean.repeat = {
                    startTime: item.repeat.startTime || '09:00',
                    endTime: item.repeat.endTime || '18:00',
                    everyMinutes: parseInt(item.repeat.everyMinutes, 10) || 60
                  };
                } else {
                  clean.time = item.time || '09:00';
                }
                if (item.hasOwnProperty('enabled') && item.enabled !== undefined) {
                  clean.enabled = Boolean(item.enabled);
                }
                if (item.hasOwnProperty('days') && Array.isArray(item.days)) {
                  clean.days = item.days;
                }
                if (item.hasOwnProperty('startDate') && item.startDate !== undefined) {
                  clean.startDate = item.startDate;
                }
                if (item.hasOwnProperty('endDate') && item.endDate !== undefined) {
                  clean.endDate = item.endDate;
                }
                return clean;
              }) : []
            };
          }

          return clone;
        }

        function loadScheduleData(data, channelNames) {
          if (!data.settings) data.settings = { enabled: true };
          if (!data.channels) data.channels = {};

          let chList = Array.isArray(channelNames) && channelNames.length > 0
            ? [...channelNames]
            : Object.keys(data.channels);

          if (chList.length === 0) {
            chList = ['team', 'personal'];
          }

          const order = Array.isArray(data.settings.channelOrder) ? data.settings.channelOrder : [];
          if (order.length > 0) {
            const ordered = order.filter(ch => chList.includes(ch));
            const rest = chList.filter(ch => !ordered.includes(ch));
            chList = [...ordered, ...rest];
          }

          chList.forEach(ch => {
            if (!data.channels[ch]) {
              data.channels[ch] = {
                enabled: true,
                days: [...ALL_DAYS],
                startDate: null,
                endDate: null,
                items: []
              };
            } else {
              if (!Array.isArray(data.channels[ch].items)) {
                data.channels[ch].items = [];
              }
              if (!Array.isArray(data.channels[ch].days)) {
                data.channels[ch].days = [...ALL_DAYS];
              }
              if (data.channels[ch].enabled === undefined) {
                data.channels[ch].enabled = true;
              }
            }
          });

          channelsList = chList;
          if (!activeChannel || !channelsList.includes(activeChannel)) {
            activeChannel = channelsList[0];
          }

          scheduleData = data;
          originalSnapshot = JSON.stringify(prepareCleanPayload(scheduleData));

          renderTabsNav();
          updateGlobalStatusUi();
          updateChannelControlsUi();
          renderTimelineList();
          updateHeaderTokenInfo();
          updateSavePromptVisibility();
        }

        function renderTabsNav() {
          const navEl = document.getElementById('segmented-tabs');
          if (!navEl) return;
          navEl.innerHTML = '';

          channelsList.forEach(ch => {
            const count = scheduleData?.channels[ch]?.items?.length || 0;
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `segmented-tab-item ${ch === activeChannel ? 'active' : ''} ${ch === draggingChannel ? 'dragging' : ''}`;
            btn.id = `tab-btn-${ch}`;
            btn.setAttribute('role', 'tab');
            btn.setAttribute('aria-selected', ch === activeChannel ? 'true' : 'false');
            btn.innerHTML = `<span>${escapeHtml(getChannelDisplayName(ch))}</span><span class="tab-count-badge">${count}</span>`;
            btn.title = `채널: #${ch} (${count}개 알림, 길게 눌러 드래그하면 순서 변경)`;
            btn.addEventListener('pointerdown', (e) => onTabPointerDown(e, ch));
            btn.onclick = () => {
              if (dragJustHappened) {
                dragJustHappened = false;
                return;
              }
              switchTab(ch);
            };
            navEl.appendChild(btn);
          });
        }

        // ==========================================
        // Tab Reordering: long-press + drag (mouse & touch via Pointer Events)
        // ==========================================
        const TAB_DRAG_HOLD_MS = 350;
        const TAB_DRAG_MOVE_TOLERANCE = 8;

        function onTabPointerDown(e, ch) {
          if (typeof e.button === 'number' && e.button !== 0) return;

          const startX = e.clientX;
          const startY = e.clientY;
          let longPressTimer = setTimeout(() => {
            longPressTimer = null;
            startTabDrag(ch);
          }, TAB_DRAG_HOLD_MS);

          function onMove(ev) {
            if (longPressTimer) {
              const dx = Math.abs(ev.clientX - startX);
              const dy = Math.abs(ev.clientY - startY);
              if (dx > TAB_DRAG_MOVE_TOLERANCE || dy > TAB_DRAG_MOVE_TOLERANCE) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
                cleanup();
              }
              return;
            }
            if (draggingChannel) {
              handleTabDragMove(ev.clientX, ev.clientY);
            }
          }

          function onUp() {
            if (longPressTimer) {
              clearTimeout(longPressTimer);
              longPressTimer = null;
            }
            if (draggingChannel) {
              endTabDrag();
            }
            cleanup();
          }

          function cleanup() {
            document.removeEventListener('pointermove', onMove);
            document.removeEventListener('pointerup', onUp);
            document.removeEventListener('pointercancel', onUp);
          }

          document.addEventListener('pointermove', onMove);
          document.addEventListener('pointerup', onUp);
          document.addEventListener('pointercancel', onUp);
        }

        function startTabDrag(ch) {
          draggingChannel = ch;
          dragJustHappened = true;
          const navEl = document.getElementById('segmented-tabs');
          if (navEl) navEl.style.touchAction = 'none';
          document.body.style.userSelect = 'none';
          renderTabsNav();
        }

        function handleTabDragMove(x, y) {
          const el = document.elementFromPoint(x, y);
          const overBtn = el && el.closest ? el.closest('.segmented-tab-item') : null;
          if (!overBtn) return;

          const overCh = overBtn.id.replace('tab-btn-', '');
          if (overCh === draggingChannel) return;

          const fromIdx = channelsList.indexOf(draggingChannel);
          const toIdx = channelsList.indexOf(overCh);
          if (fromIdx === -1 || toIdx === -1) return;

          channelsList.splice(fromIdx, 1);
          channelsList.splice(toIdx, 0, draggingChannel);
          renderTabsNav();
        }

        function endTabDrag() {
          draggingChannel = null;
          const navEl = document.getElementById('segmented-tabs');
          if (navEl) navEl.style.touchAction = '';
          document.body.style.userSelect = '';

          if (scheduleData) {
            if (!scheduleData.settings) scheduleData.settings = {};
            scheduleData.settings.channelOrder = [...channelsList];
          }

          renderTabsNav();
          updateSavePromptVisibility();
        }

        function updateHeaderTokenInfo() {
          const el = document.getElementById('token-display');
          if (memoryToken === 'demo-mode') {
            el.textContent = '데모 모드 동작 중';
          } else if (memoryToken) {
            const masked = memoryToken.length > 4 ? memoryToken.substring(0, 2) + '****' + memoryToken.substring(memoryToken.length - 2) : '****';
            el.textContent = `토큰: ${masked}`;
          } else {
            el.textContent = '토큰 미설정';
          }
        }

        // ==========================================
        // UI Operations: Global ON/OFF & Group Defaults
        // ==========================================
        function updateGlobalStatusUi() {
          const isEnabled = Boolean(scheduleData?.settings?.enabled);
          document.getElementById('global-switch').checked = isEnabled;
          const dot = document.getElementById('global-dot');
          const txt = document.getElementById('global-status-text');

          if (isEnabled) {
            dot.className = 'global-status-dot';
            txt.textContent = '전체 ON';
          } else {
            dot.className = 'global-status-dot halted';
            txt.textContent = '전체 OFF';
          }
        }

        window.toggleGlobalEnabled = function(val) {
          if (!scheduleData) return;
          scheduleData.settings.enabled = val;
          updateGlobalStatusUi();

          const isGlobalOn = Boolean(val);
          const chData = scheduleData.channels[activeChannel] || {};
          const items = chData.items || [];
          const itemElements = document.querySelectorAll('#timeline-list .timeline-item');
          if (itemElements.length > 0 && itemElements.length === items.length) {
            itemElements.forEach((el) => {
              const cb = el.querySelector('input[type="checkbox"][data-item-index]');
              if (!cb) return;
              const idx = parseInt(cb.getAttribute('data-item-index'), 10);
              const item = items[idx];
              if (!item) return;
              const isItemEnabled = item.hasOwnProperty('enabled') ? Boolean(item.enabled) : Boolean(chData.enabled);
              el.classList.toggle('dimmed', !isGlobalOn || !isItemEnabled);
            });
          } else {
            renderTimelineList();
          }
          updateSavePromptVisibility();
        };

        window.switchTab = function(channel) {
          activeChannel = channel;
          document.querySelectorAll('#segmented-tabs .segmented-tab-item').forEach(btn => {
            const isMatch = btn.id === `tab-btn-${channel}`;
            btn.classList.toggle('active', isMatch);
            btn.setAttribute('aria-selected', isMatch ? 'true' : 'false');
          });
          updateChannelControlsUi();
          renderTimelineList();
        };

        window.toggleGlobalFromWrap = function() {
          const sw = document.getElementById('global-switch');
          sw.checked = !sw.checked;
          toggleGlobalEnabled(sw.checked);
        };

        window.toggleGroupDefaultFromWrap = function() {
          const sw = document.getElementById('group-default-switch');
          sw.checked = !sw.checked;
          toggleGroupDefaultEnabled(sw.checked);
        };

        function updateChannelControlsUi() {
          if (!scheduleData) return;
          const chData = scheduleData.channels[activeChannel] || {};
          const isChEnabled = Boolean(chData.enabled);
          document.getElementById('group-default-switch').checked = isChEnabled;

          const channelDisplayName = getChannelDisplayName(activeChannel);
          document.getElementById('defaults-btn-label').textContent = `${channelDisplayName} 기본값`;
          document.getElementById('defaults-panel-heading').textContent = `${channelDisplayName} (#${activeChannel}) 기본값`;
          const batchLabel = document.getElementById('channel-batch-label');
          if (batchLabel) {
            batchLabel.textContent = `${channelDisplayName} 채널 알림 ${isChEnabled ? 'ON' : 'OFF'}`;
          }
          const chDot = document.getElementById('channel-status-dot');
          if (chDot) {
            chDot.className = `channel-status-dot ${isChEnabled ? '' : 'halted'}`;
          }

          // Populate Defaults form
          renderDefaultsDaysRow(chData.days || []);
          document.getElementById('def-start-date').value = chData.startDate || '';
          document.getElementById('def-end-date').value = chData.endDate || '';
        }

        window.toggleGroupDefaultEnabled = function(val) {
          if (!scheduleData || !scheduleData.channels[activeChannel]) return;
          scheduleData.channels[activeChannel].enabled = val;
          const chData = scheduleData.channels[activeChannel] || {};
          const isGlobalOn = Boolean(scheduleData.settings?.enabled);

          const channelDisplayName = getChannelDisplayName(activeChannel);
          const batchLabel = document.getElementById('channel-batch-label');
          if (batchLabel) {
            batchLabel.textContent = `${channelDisplayName} 채널 알림 ${val ? 'ON' : 'OFF'}`;
          }
          const chDot = document.getElementById('channel-status-dot');
          if (chDot) {
            chDot.className = `channel-status-dot ${val ? '' : 'halted'}`;
          }

          const items = chData.items || [];
          const itemElements = document.querySelectorAll('#timeline-list .timeline-item');
          if (itemElements.length > 0 && itemElements.length === items.length) {
            itemElements.forEach((el) => {
              const cb = el.querySelector('input[type="checkbox"][data-item-index]');
              if (!cb) return;
              const idx = parseInt(cb.getAttribute('data-item-index'), 10);
              const item = items[idx];
              if (!item) return;
              if (!item.hasOwnProperty('enabled')) {
                cb.checked = val;
              }
              const isItemEnabled = item.hasOwnProperty('enabled') ? Boolean(item.enabled) : Boolean(chData.enabled);
              el.classList.toggle('dimmed', !isGlobalOn || !isItemEnabled);
            });
          } else {
            renderTimelineList();
          }
          updateSavePromptVisibility();
        };

        window.toggleDefaultsPanel = function() {
          defaultsOpen = !defaultsOpen;
          const p = document.getElementById('defaults-panel');
          const btn = document.getElementById('btn-toggle-defaults');
          if (defaultsOpen) {
            p.classList.add('open');
            btn.classList.add('open');
            updateChannelControlsUi();
          } else {
            p.classList.remove('open');
            btn.classList.remove('open');
          }
        };

        const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
        const WEEKENDS = ['Sat', 'Sun'];

        function isSameDays(arr1, arr2) {
          if (!arr1 || !arr2 || arr1.length !== arr2.length) return false;
          const s = new Set(arr1);
          return arr2.every(d => s.has(d));
        }

        function renderPresetButtonsHtml(daysArr, onPresetFnName) {
          const isAll = isSameDays(daysArr, ALL_DAYS);
          const isWeekdays = isSameDays(daysArr, WEEKDAYS);
          const isWeekends = isSameDays(daysArr, WEEKENDS);

          return `
            <button type="button" class="days-preset-pill ${isAll ? 'active' : ''}" onclick="${onPresetFnName}('all')">매일</button>
            <button type="button" class="days-preset-pill ${isWeekdays ? 'active' : ''}" onclick="${onPresetFnName}('weekdays')">평일</button>
            <button type="button" class="days-preset-pill ${isWeekends ? 'active' : ''}" onclick="${onPresetFnName}('weekends')">주말</button>
          `;
        }

        function renderDefaultsDaysPresets(daysArr) {
          const presetContainer = document.getElementById('def-days-presets');
          if (presetContainer) {
            presetContainer.innerHTML = renderPresetButtonsHtml(daysArr, 'handleDefaultsPresetClick');
          }
        }

        window.handleDefaultsPresetClick = function(preset) {
          if (!scheduleData || !scheduleData.channels[activeChannel]) return;
          let targetDays = [];
          if (preset === 'all') targetDays = [...ALL_DAYS];
          else if (preset === 'weekdays') targetDays = [...WEEKDAYS];
          else if (preset === 'weekends') targetDays = [...WEEKENDS];

          scheduleData.channels[activeChannel].days = targetDays;
          renderDefaultsDaysRow(targetDays);
          renderTimelineList();
        };

        function renderDefaultsDaysRow(selectedDays) {
          const row = document.getElementById('def-days-row');
          if (!row) return;
          row.innerHTML = '';
          const currentSet = new Set(selectedDays);

          ALL_DAYS.forEach(day => {
            const btn = document.createElement('button');
            btn.type = 'button';
            const isSat = day === 'Sat';
            const isSun = day === 'Sun';
            const extraClass = isSat ? 'day-sat' : (isSun ? 'day-sun' : '');
            btn.className = `day-btn ${extraClass} ${currentSet.has(day) ? 'selected' : ''}`;
            btn.textContent = DAY_LABELS[day] || day;
            btn.title = `${DAY_LABELS[day]}요일`;
            btn.onclick = function() {
              if (currentSet.has(day)) currentSet.delete(day);
              else currentSet.add(day);
              const sorted = ALL_DAYS.filter(d => currentSet.has(d));
              scheduleData.channels[activeChannel].days = sorted;
              renderDefaultsDaysRow(sorted);
              renderTimelineList();
            };
            row.appendChild(btn);
          });
          renderDefaultsDaysPresets(selectedDays);
        }

        window.updateDefaultDate = function(key, val) {
          if (!scheduleData || !scheduleData.channels[activeChannel]) return;
          scheduleData.channels[activeChannel][key] = val ? val : null;
          renderTimelineList();
        };

        // ==========================================
        // Timeline List Renderer (Always sorted by time)
        // ==========================================
        function renderTimelineList() {
          const listEl = document.getElementById('timeline-list');
          listEl.innerHTML = '';

          if (!scheduleData || !scheduleData.channels) return;

          const chData = scheduleData.channels[activeChannel] || {};
          const items = chData.items || [];
          const isGlobalOn = Boolean(scheduleData.settings?.enabled);

          if (items.length === 0) {
            listEl.innerHTML = `
              <div class="empty-state">
                <div class="empty-state-icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                  </svg>
                </div>
                <div class="empty-state-title">등록된 ${escapeHtml(getChannelDisplayName(activeChannel))} 알림이 없습니다</div>
                <div class="empty-state-desc">아래의 '새 알림 추가' 버튼을 눌러 첫 번째 알림 일정을 등록해보세요.</div>
              </div>
            `;
            return;
          }

          // Always sort by time (HH:MM ascending; repeating items sort by their start time)
          const mapped = items.map((item, originalIndex) => ({ item, originalIndex }));
          mapped.sort((a, b) => {
            const tA = (a.item.repeat ? a.item.repeat.startTime : a.item.time) || '00:00';
            const tB = (b.item.repeat ? b.item.repeat.startTime : b.item.time) || '00:00';
            return tA.trim().localeCompare(tB.trim());
          });

          mapped.forEach(({ item, originalIndex }, idx) => {
            const isItemEnabled = item.hasOwnProperty('enabled') ? Boolean(item.enabled) : Boolean(chData.enabled);
            const isDimmed = !isGlobalOn || !isItemEnabled;
            const isFirstItem = (idx === 0);
            const isLastItem = (idx === mapped.length - 1);

            const itemEl = document.createElement('div');
            itemEl.className = `timeline-item ${isDimmed ? 'dimmed' : ''}`;

            const metaLineHtml = buildMetaLineHtml(item, chData);
            const timeLabel = item.repeat
              ? `${item.repeat.startTime}~${item.repeat.endTime} · ${item.repeat.everyMinutes}분마다`
              : (item.time || '09:00');

            itemEl.innerHTML = `
              <!-- Main Row: Time on Left, Timeline Dots in Middle, Content Indented -->
              <div class="timeline-row" onclick="handleItemRowClick(${originalIndex}, event)">
                <div class="timeline-time-col">
                  <div class="time-display">${escapeHtml(timeLabel)}</div>
                </div>
                <div class="timeline-track-col">
                  ${!isFirstItem ? '<div class="timeline-track-line-top"></div>' : ''}
                  <div class="timeline-dot-wrapper">
                    <div class="timeline-track-dot"></div>
                  </div>
                  ${!isLastItem ? '<div class="timeline-track-line-bottom"></div>' : ''}
                </div>
                <div class="timeline-content-col">
                  <!-- Title Row: Item Name + Duplicate Icon & Direct List Toggle -->
                  <div class="timeline-title-row">
                    <div class="item-name-text">${escapeHtml(item.name || '이름 없는 알림')}</div>
                    <div class="item-actions-group">
                      <button type="button" class="btn-item-icon" onclick="duplicateItem(${originalIndex}, event)" title="이 일정 복제">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                      </button>
                      <label class="switch" onclick="event.stopPropagation();" title="알림 켜기/끄기">
                        <input type="checkbox" data-item-index="${originalIndex}" ${isItemEnabled ? 'checked' : ''} onchange="toggleItemEnabled(${originalIndex}, this.checked, this)" />
                        <span class="switch-slider"></span>
                      </label>
                    </div>
                  </div>

                  <!-- Clean Flat Message Preview below Title -->
                  <div class="msg-bubble-preview">
                    <div class="msg-bubble-text">${renderPreviewMarkdown(escapeHtml(item.message || ''))}</div>
                  </div>

                  <!-- Flat Inline Schedule Meta below the message (Direction A) -->
                  ${metaLineHtml}
                </div>
              </div>
            `;

            listEl.appendChild(itemEl);
          });
          updateSavePromptVisibility();
        }

        // Duplicate / Copy Schedule Item
        window.duplicateItem = function(index, e) {
          if (e) e.stopPropagation();
          if (!scheduleData || !scheduleData.channels[activeChannel]) return;
          const items = scheduleData.channels[activeChannel].items;
          if (!items || !items[index]) return;

          const clone = JSON.parse(JSON.stringify(items[index]));
          clone.name = clone.name ? `${clone.name} (복사본)` : '새 알림 (복사본)';

          // Insert right after current item
          items.splice(index + 1, 0, clone);
          renderTabsNav();
          renderTimelineList();
          showToast(`'${clone.name}' 일정이 복제되었습니다.`);
        };

        // Clean Meta Information (Plain text outside of chips, muted color preserved)
        function buildMetaLineHtml(item, chData) {
          const parts = [];

          // 1. Days label
          const daysArr = item.hasOwnProperty('days') ? item.days : chData.days;
          if (Array.isArray(daysArr) && daysArr.length > 0) {
            let label = '';
            if (daysArr.length === 7) {
              label = '매일';
            } else if (daysArr.length === 5 && !daysArr.includes('Sat') && !daysArr.includes('Sun')) {
              label = '평일 (월~금)';
            } else if (daysArr.length === 2 && daysArr.includes('Sat') && daysArr.includes('Sun')) {
              label = '주말 (토·일)';
            } else {
              label = daysArr.map(d => DAY_LABELS[d] || d).join('');
            }
            parts.push(`
              <span class="meta-text-item">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>${escapeHtml(label)}</span>
              </span>
            `);
          }

          // 2. Date range
          const hasCustomDate = item.hasOwnProperty('startDate') || item.hasOwnProperty('endDate');
          const s = hasCustomDate ? item.startDate : chData.startDate;
          const e = hasCustomDate ? item.endDate : chData.endDate;
          if (s || e) {
            let dateText = '';
            if (s && e) {
              dateText = s === e ? `${s} 당일` : `${s} ~ ${e}`;
            } else if (e) {
              dateText = `~ ${e}`;
            } else if (s) {
              dateText = `${s} ~`;
            }
            parts.push(`
              <span class="meta-text-item">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>${escapeHtml(dateText)}</span>
              </span>
            `);
          }

          if (parts.length === 0) return '';

          return `<div class="item-meta-line">${parts.join('<span class="meta-text-divider">·</span>')}</div>`;
        }

        // ==========================================
        // Edit Modal (Popup Form) Interactions
        // ==========================================
        window.handleItemRowClick = function(index, e) {
          if (e.target.closest('.switch') || e.target.closest('input')) return;
          openEditModal(index);
        };

          const effectiveStartDate = hasDates ? (item.startDate || '') : (chData.startDate || '');

          bodyEl.innerHTML = `
            <!-- Name Field -->
            <div class="edit-field">

                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>

            </div>

            <!-- Time vs. Repeat Toggle -->
            <div class="edit-field">
              <div class="override-toggle-row" onclick="toggleModalOverrideFromRow('modal-repeat-toggle-cb')">
                <span class="override-toggle-title">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 6v6l4 2"></path>
                  </svg>
                  매시 반복
                  <span class="override-hint-badge" id="modal-repeat-hint">${item.repeat ? '(구간 반복)' : '(단일 시각)'}</span>
                </span>
                <label class="switch" onclick="event.stopPropagation();" title="구간 반복 토글">
                  <input type="checkbox" id="modal-repeat-toggle-cb" ${item.repeat ? 'checked' : ''} onchange="handleModalToggleRepeat(this.checked)" />
                  <span class="switch-slider"></span>
                </label>
              </div>
            </div>

            <!-- Single Time Field: <input type="time"> -->
            <div class="edit-field" id="modal-time-single-wrap" style="${item.repeat ? 'display:none;' : ''}">
              <label class="edit-label">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>전송 시각 (HH:MM)</span>
              </label>
              <input type="time" class="input-time" id="modal-field-time" value="${escapeHtml(item.time || '09:00')}" oninput="handleModalFieldChange('time', this.value)" />
            </div>

            <!-- Repeat Range Fields: start/end time + interval -->
            <div class="edit-field" id="modal-repeat-wrap" style="${item.repeat ? '' : 'display:none;'}">
              <label class="edit-label">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>반복 구간 (시작~종료)</span>
              </label>
              <div class="date-dual-row">
                <input type="time" class="input-time" id="modal-repeat-start" value="${escapeHtml((item.repeat && item.repeat.startTime) || '09:00')}" onchange="handleModalRepeatChange('startTime', this.value)" />
                <input type="time" class="input-time" id="modal-repeat-end" value="${escapeHtml((item.repeat && item.repeat.endTime) || '18:00')}" onchange="handleModalRepeatChange('endTime', this.value)" />
              </div>
              <label class="edit-label" style="margin-top: 10px;">

          if (currentModalIndex === null || !scheduleData.channels[activeChannel]) return;
          const items = scheduleData.channels[activeChannel].items;
          const item = items[currentModalIndex];
          if (!item) return;

          const singleWrap = document.getElementById('modal-time-single-wrap');

          const item = items[currentModalIndex];

          const items = scheduleData.channels[activeChannel].items;
          const item = items[currentModalIndex];
          if (!item) return;
          const chData = scheduleData.channels[activeChannel] || {};

            hint.textContent = '(채널 기본값 사용)';
            renderModalDaysButtons(chData.days || ALL_DAYS);

        function renderModalDaysButtonsHtml(daysArr) {
          const set = new Set(daysArr);
          return ALL_DAYS.map(day => {
            const isSel = set.has(day);
            const isSat = day === 'Sat';
            const isSun = day === 'Sun';
            const extraClass = isSat ? 'day-sat' : (isSun ? 'day-sun' : '');
            return `<button type="button" class="day-btn ${extraClass} ${isSel ? 'selected' : ''}" onclick="handleModalDayClick('${day}')" title="${DAY_LABELS[day]}요일">${DAY_LABELS[day]}</button>`;

        function renderModalDaysButtons(daysArr) {
          const row = document.getElementById('modal-days-buttons-row');

            presetContainer.innerHTML = renderPresetButtonsHtml(daysArr, 'handleModalPresetClick');

        window.handleModalPresetClick = function(preset) {
          if (currentModalIndex === null || !scheduleData.channels[activeChannel]) return;
          const items = scheduleData.channels[activeChannel].items;
          const item = items[currentModalIndex];
          if (!item || !item.hasOwnProperty('days')) return;
          let targetDays = [];
          if (preset === 'all') targetDays = [...ALL_DAYS];
          else if (preset === 'weekdays') targetDays = [...WEEKDAYS];
          else if (preset === 'weekends') targetDays = [...WEEKENDS];

          item.days = targetDays;
          renderModalDaysButtons(item.days);
        };

        window.handleModalDayClick = function(day) {
          if (currentModalIndex === null || !scheduleData.channels[activeChannel]) return;
          const items = scheduleData.channels[activeChannel].items;
          const item = items[currentModalIndex];
          if (!item || !item.hasOwnProperty('days')) return;
          if (!Array.isArray(item.days)) item.days = [];
          const set = new Set(item.days);
          if (set.has(day)) set.delete(day);
          else set.add(day);
          item.days = ALL_DAYS.filter(d => set.has(d));
          renderModalDaysButtons(item.days);
        };

        // ==========================================
        // Markdown Simulator & Utilities
        // ==========================================
        // Friendly, soft Markdown renderer for the timeline cards (Unbolded, same style as multiline body)
        function renderPreviewMarkdown(str) {
          if (!str || !str.trim()) return '<span style="color:var(--text-dim); font-style:italic;">(메시지 내용 없음)</span>';

          // Strip bold markers so preview remains regular text matching the rest of the body
          let out = str.replace(/\*\*(.*?)\*\*/g, '$1');
          // Italic: *text*
          out = out.replace(/(?<!\*)\*(?!\*)(.*?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
          // Inline code: `text`
          out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
          // Variables: {{var}}
          out = out.replace(/\{\{([a-zA-Z0-9_]+)\}\}/g, '<span class="msg-bubble-var">{{$1}}</span>');

          return out;
        }

        // Exact Discord simulator for the Edit Modal Live Preview
        function renderDiscordMarkdown(str) {
          if (!str) return '<span style="color:#949BA4; font-style:italic;">(내용 없음)</span>';

          // Bold: **text**
          let out = str.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          // Italic: *text*
          out = out.replace(/(?<!\*)\*(?!\*)(.*?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
          // Inline code: `text`
          out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
          // Variables: {{var}}
          out = out.replace(/\{\{([a-zA-Z0-9_]+)\}\}/g, '<span class="discord-var">{{$1}}</span>');

          return out;
        }

        function escapeHtml(str) {
          if (str === null || str === undefined) return '';
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
        }

        function hasUnsavedChanges() {
          if (!scheduleData || !originalSnapshot) return false;
          const current = JSON.stringify(prepareCleanPayload(scheduleData));
          return current !== originalSnapshot;
        }

        function updateSavePromptVisibility() {
          const isDirty = hasUnsavedChanges();
          const bar = document.getElementById('floating-save-bar');
          if (!bar) return;
          if (isDirty) {
            bar.classList.add('visible');
          } else {
            bar.classList.remove('visible');
          }
        }

        window.handleDiscardChanges = function() {
          if (!originalSnapshot) return;
          try {
            const restored = JSON.parse(originalSnapshot);
            loadScheduleData(restored, channelsList);
            showToast('변경사항이 취소되었습니다.');
          } catch (e) {
            console.error('Failed to revert changes', e);
          }
        };

        window.addEventListener('beforeunload', function(e) {
          if (hasUnsavedChanges()) {
            e.preventDefault();
            e.returnValue = '';
          }
        });

        function setSaveButtonState(loading) {
          const btn = document.getElementById('btn-save');
          const txt = document.getElementById('btn-save-text');
          if (loading) {
            btn.disabled = true;
            txt.textContent = '저장 중...';
          } else {
            btn.disabled = false;
            txt.textContent = '저장';
          }
        }

        function showErrorBanner(msg) {
          const b = document.getElementById('error-banner');
          const t = document.getElementById('error-banner-text');
          t.textContent = msg;
          b.style.display = 'block';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.hideErrorBanner = function() {
          document.getElementById('error-banner').style.display = 'none';
        };

        function showToast(msg) {
          const t = document.getElementById('toast');
          t.textContent = msg;
          t.classList.add('show');
          setTimeout(() => t.classList.remove('show'), 2600);
        }

        // ==========================================
        // Install-to-Home-Screen Nudge
        // ==========================================
        function isStandaloneMode() {
          const mq = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
          return Boolean(mq) || window.navigator.standalone === true;
        }

        function isIOSDevice() {
          const ua = window.navigator.userAgent || '';
          const isIOSUA = /iPad|iPhone|iPod/.test(ua);
          // iPadOS 13+ reports as "Macintosh" but is touch-capable, unlike a real Mac.
          const isIPadOS = window.navigator.platform === 'MacIntel' && window.navigator.maxTouchPoints > 1;
          return isIOSUA || isIPadOS;
        }

        function getInstallDismissCount() {
          try { return parseInt(localStorage.getItem(INSTALL_DISMISS_COUNT_KEY) || '0', 10) || 0; } catch (e) { return 0; }
        }

        // 1st close = 7-day snooze, 2nd close = permanent. Installing never calls this.
        function isInstallToastSuppressed() {
          const count = getInstallDismissCount();
          if (count >= 2) return true;
          if (count === 1) {
            let until = 0;
            try { until = parseInt(localStorage.getItem(INSTALL_SNOOZE_UNTIL_KEY) || '0', 10) || 0; } catch (e) {}
            if (Date.now() < until) return true;
          }
          return false;
        }

        function recordInstallToastDismiss() {
          const count = getInstallDismissCount() + 1;
          try {
            localStorage.setItem(INSTALL_DISMISS_COUNT_KEY, String(count));
            if (count === 1) {
              localStorage.setItem(INSTALL_SNOOZE_UNTIL_KEY, String(Date.now() + INSTALL_SNOOZE_DAYS * 24 * 60 * 60 * 1000));
            }
          } catch (e) {}
        }

        // Fills in the toast's text/button for the current platform. Returns
        // false when there's nothing actionable to show (desktop browser with
        // no captured install prompt, etc).
        function renderInstallToastContent() {
          const textEl = document.getElementById('install-toast-text');
          const btnEl = document.getElementById('install-toast-btn');
          if (isIOSDevice()) {
            textEl.textContent = '공유 버튼을 눌러 홈 화면에 추가하세요';
            btnEl.style.display = 'none';
            return true;
          }
          if (deferredInstallPrompt) {
            textEl.textContent = '앱처럼 홈 화면에 설치해보세요';
            btnEl.style.display = 'inline-flex';
            return true;
          }
          return false;
        }

        function showInstallToast() {
          if (!renderInstallToastContent()) return;
          const el = document.getElementById('install-toast');
          requestAnimationFrame(function() { el.classList.add('show'); });
        }

        // Called right after a successful token auth / list load. Shows
        // immediately (no delay) once standalone/suppression checks pass.
        function maybeShowInstallToast() {
          if (isStandaloneMode() || isInstallToastSuppressed()) return;
          if (!isIOSDevice() && !deferredInstallPrompt) return; // nothing we can offer
          showInstallToast();
        }

        window.dismissInstallToast = function() {
          const el = document.getElementById('install-toast');
          el.classList.remove('show');
          recordInstallToastDismiss();
        };

        window.handleInstallClick = async function() {
          const prompt = deferredInstallPrompt;
          if (!prompt) {
            dismissInstallToast();
            return;
          }
          deferredInstallPrompt = null;
          try {
            prompt.prompt();
            const choice = await prompt.userChoice;
            if (choice && choice.outcome === 'accepted') {
              // Installing is not a "close" — hide without recording a dismiss.
              document.getElementById('install-toast').classList.remove('show');
            }
            // outcome === 'dismissed': leave the toast up so they can retry or close it themselves.
          } catch (e) {}
        };

        // Settings menu entry point: always available, independent of the
        // banner's own dismiss/snooze memory.
        window.openInstallFromMenu = function() {
          closeSettingsMenu();
          if (isStandaloneMode()) {
            showToast('이미 홈 화면에 추가되어 있어요.');
            return;
          }
          if (deferredInstallPrompt) {
            handleInstallClick();
            return;
          }
          if (renderInstallToastContent()) {
            const el = document.getElementById('install-toast');
            requestAnimationFrame(function() { el.classList.add('show'); });
            return;
          }
          showToast('이 브라우저에서는 홈 화면 추가를 지원하지 않아요.');
        };

        // ==========================================
        // Settings Menu & Dropdown Operations
        // ==========================================
        window.toggleSettingsMenu = function(e) {
          if (e) e.stopPropagation();
          const menu = document.getElementById('settings-menu');
          const btn = document.getElementById('settings-toggle-btn');
          if (!menu) return;
          const isOpen = menu.classList.contains('open');
          if (isOpen) {
            closeSettingsMenu();
          } else {
            menu.classList.add('open');
            if (btn) {
              btn.classList.add('active');
              btn.setAttribute('aria-expanded', 'true');
            }
          }
        };

        function closeSettingsMenu() {
          const menu = document.getElementById('settings-menu');
          const btn = document.getElementById('settings-toggle-btn');
          if (menu) menu.classList.remove('open');
          if (btn) {
            btn.classList.remove('active');
            btn.setAttribute('aria-expanded', 'false');
          }
        }

        window.toggleThemeFromMenu = function() {
          toggleTheme();
        };

        window.resetAuthToken = function() {
          closeSettingsMenu();
          memoryToken = '';
          try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (e) {}
          showAuthPrompt();
        };

        // Close dropdown when clicking anywhere outside
        document.addEventListener('click', function(e) {
          const wrap = document.getElementById('settings-wrap');
          if (wrap && !wrap.contains(e.target)) {
            closeSettingsMenu();
          }
        });

        // Close dropdown on Escape key
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            closeSettingsMenu();
          }
        });

        // ==========================================
        // Auth Modal & Demo Mode
        // ==========================================
        window.showAuthPrompt = function(errMsg) {
          document.getElementById('auth-screen').style.display = 'flex';
          const errEl = document.getElementById('auth-err-msg');
          const closeBtn = document.getElementById('auth-close-btn');

          // Only show close button if user is already authenticated or in demo mode
          if (closeBtn) {
            closeBtn.style.display = (memoryToken && memoryToken !== '') ? 'flex' : 'none';
          }

          if (errMsg) {
            errEl.textContent = errMsg;
            errEl.style.display = 'block';
          } else {
            errEl.style.display = 'none';
          }
          const inp = document.getElementById('auth-input-key');
          inp.value = memoryToken && memoryToken !== 'demo-mode' ? memoryToken : '';
          inp.focus();
        };

        window.hideAuthScreen = function() {
          document.getElementById('auth-screen').style.display = 'none';
        };

        window.submitAuth = function(e) {
          e.preventDefault();
          const key = document.getElementById('auth-input-key').value.trim();
          if (!key) return;
          memoryToken = key;
          fetchSchedule(memoryToken);
        };

        window.startDemoMode = function() {
          memoryToken = 'demo-mode';
          hideAuthScreen();
          loadScheduleData(JSON.parse(JSON.stringify(SEED_DATA)));
          showToast('데모 모드로 시작되었습니다.');
          maybeShowInstallToast();
        };

      })();
    </script>
  </body>
</html>
